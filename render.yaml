# ============================================================
# MindSense AI — Render Blueprint Configuration
# ============================================================
# Deploy to Render using Blueprints:
# 1. Connect your repository to Render (https://dashboard.render.com)
# 2. Select "New" -> "Blueprint"
# 3. Render will automatically detect this `render.yaml` file
# 4. Provide your `GEMINI_API_KEY` when prompted
# ============================================================

services:
  - type: web
    name: mindsense-ai
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload app:app"
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TEMPERATURE
        value: "0.7"
      - key: GEMINI_MAX_TOKENS
        value: "1024"
      - key: FLASK_DEBUG
        value: "False"
      # Lightweight backends — no heavy models loaded on free tier
      - key: CLASSIFIER_BACKEND
        value: rules
      - key: EMBEDDING_BACKEND
        value: tfidf
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
